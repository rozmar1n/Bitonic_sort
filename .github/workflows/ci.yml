name: CI

on:
  push:
  pull_request:

jobs:
  build-only:
    name: Build Only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PROJECT_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            ocl-icd-opencl-dev \
            opencl-clhpp-headers

      - name: Install dependencies (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-WithRetry {
            param(
              [scriptblock]$Action,
              [int]$MaxAttempts = 4,
              [int]$DelaySeconds = 20
            )

            for ($Attempt = 1; $Attempt -le $MaxAttempts; $Attempt++) {
              try {
                & $Action
                if ($LASTEXITCODE -ne 0) {
                  throw "Command exited with code $LASTEXITCODE"
                }
                return
              } catch {
                if ($Attempt -eq $MaxAttempts) {
                  throw
                }
                Write-Host "Attempt $Attempt failed. Retrying in $DelaySeconds seconds..."
                Start-Sleep -Seconds $DelaySeconds
              }
            }
          }

          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:PROJECT_VCPKG_ROOT"
          Invoke-WithRetry { & "$env:PROJECT_VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics }
          Invoke-WithRetry { & "$env:PROJECT_VCPKG_ROOT/vcpkg.exe" install opencl:x64-windows }

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:PROJECT_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build build --config Release

      - name: Run smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          ctest --test-dir build --output-on-failure -R opencl_smoke_test

      - name: Run smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          ctest --test-dir build -C Release --output-on-failure -R opencl_smoke_test
