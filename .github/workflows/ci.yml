name: CI

on:
  push:
  pull_request:

jobs:
  build-only:
    name: Build Only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            ocl-icd-opencl-dev \
            opencl-clhpp-headers

      - name: Install OpenCL headers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git "$env:RUNNER_TEMP/OpenCL-Headers"
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE/include/CL" -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP/OpenCL-Headers/CL/*" "$env:GITHUB_WORKSPACE/include/CL/" -Recurse -Force

          $openclLib = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" -Recurse -Filter OpenCL.lib | Select-Object -First 1
          if (-not $openclLib) {
            throw "OpenCL.lib not found in Windows SDK"
          }
          "OPENCL_LIBRARY=$($openclLib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DOpenCL_INCLUDE_DIR="$env:GITHUB_WORKSPACE/include" `
            -DOpenCL_LIBRARY="$env:OPENCL_LIBRARY"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build build --config Release
